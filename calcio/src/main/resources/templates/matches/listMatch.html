<!DOCTYPE html>
<html>

<head>
    <title>Partite</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    
    <h1>Partite</h1>
    
    <div style="margin-bottom: 20px; display: flex; justify-content: flex-start;">
        <form th:action="@{/matches}" method="GET" style="display: flex; gap: 10px; align-items: center;">
            <label for="teamFilter" style="margin-bottom: 0;">Filtra per squadra:</label>
            <select id="teamFilter" name="teamId" style="margin-bottom: 0; min-width: 200px;">
                <option value="">Tutte le squadre</option>
                <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}" th:selected="${team.id == selectedTeamId}"></option>
            </select>
            <button type="submit" style="padding: 10px 20px; margin-bottom: 0;">Filtra</button>
        </form>
    </div>

    <div th:if="${matches==null || matches.isEmpty()}">Non ci sono partite nel sistema</div>
    <ul>
        <li th:each="match : ${matches}">
            <a th:href="@{'/matches' + '/' + ${match.id}}" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 12px; gap: 10px;">
                    <div style="display: flex; flex-direction: column; align-items: center; flex: 1;">
                        <img th:if="${match.homeTeam.logo != null and !match.homeTeam.logo.isEmpty()}" th:src="${match.homeTeam.logo}" alt="Home Logo" style="height: 35px; width: auto; object-fit: contain; margin-bottom: 5px;" />
                        <span th:text="${match.homeTeam.name}" style="font-size: 16px; font-weight: 700; color: var(--text-main); text-align: center;">Roma</span>
                    </div>
                    <div style="font-size: 14px; font-weight: 600; color: var(--text-muted);">vs</div>
                    <div style="display: flex; flex-direction: column; align-items: center; flex: 1;">
                        <img th:if="${match.awayTeam.logo != null and !match.awayTeam.logo.isEmpty()}" th:src="${match.awayTeam.logo}" alt="Away Logo" style="height: 35px; width: auto; object-fit: contain; margin-bottom: 5px;" />
                        <span th:text="${match.awayTeam.name}" style="font-size: 16px; font-weight: 700; color: var(--text-main); text-align: center;">Lazio</span>
                    </div>
                </div>
                <div style="font-size: 14px; font-weight: 600; color: #0056b3; width: 100%; text-align: right; box-sizing: border-box; padding-right: 24px; margin-top: auto;">Esplora &rarr;</div>
            </a>
        </li>
    </ul>
    <div th:if="${isAdmin}">
        <a href="/admin/matches/new"><button type="button">Aggiungi partita</button></a>
    </div>
</body>

</html>
