<!DOCTYPE html>
<html>

<head>
    <title>Partite</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
    <div><a href="/"><img src="/images/logo-siw.png" width="50%" /></a></div>
    <h1>Partite</h1>
    <div th:if="${matches==null || matches.isEmpty()}">Non ci sono partite nel sistema</div>
    <ul>
        <li th:each="match : ${matches}">
            <a th:href="@{'/matches' + '/' + ${match.id}}"
                th:text="${match.homeTeam.name} + ' vs ' + ${match.awayTeam.name}">Roma vs Lazio</a>
        </li>
    </ul>
    <div th:if="${isAdmin}">
        <a href="/admin/matches/new"><button type="button">Aggiungi partita</button></a>
    </div>
</body>

</html>
