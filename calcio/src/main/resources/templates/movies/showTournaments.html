<!DOCTYPE html>
<html>

<head>
	<title>Torneo</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<div><a href="/"><img src="/images/logo-siw.png" width="50%" /></a></div>
	<h1>Dettagli torneo</h1>
	<div th:if="${tournament}">
		<span th:text="${tournament.name}">serie A</span>
		<span th:text="'(' + ${tournament.year} + ')'">2026</span>
		<span th:text="'(' + ${tournament.description} + ')'">descrizione</span>
		<!--<span><img width="5%" th:src="${tournament.urlImage}" alt="Immagine del film" /></span>
		<div>
			<strong>Regista:</strong> 
			<span th:if="${movie.director}" th:text="${movie.director.name}">Nome regista</span>
			<span th:unless="${movie.director}">Non specificato</span>
		</div>-->
		<div>
			<strong>Partite:</strong>
			<ul th:if="${not #lists.isEmpty(tournament.matches)}">
				<li th:each="match : ${tournament.matches}" th:text="${match}">partita</li>
			</ul>
			<span th:if="${#lists.isEmpty(tournament.matches)}">Nessuna partita specificata</span>
		</div>
		<div>
			<strong>Squadre:</strong>
			<ul th:if="${not #lists.isEmpty(tournament.teams)}">
				<li th:each="team : ${tournament.teams}" th:text="${team.name}">nome squadra</li>
			</ul>
			<span th:if="${#lists.isEmpty(tournament.teams)}">Nessuna squadra specificata</span>
		</div>
	</div>
	<div th:unless="${tournament}">Non esiste</div>
</body>

</html>
