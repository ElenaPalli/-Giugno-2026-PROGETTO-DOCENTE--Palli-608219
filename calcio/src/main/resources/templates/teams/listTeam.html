<!DOCTYPE html>
<html>

<head>
	<title>Squadre</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>

	<h1>Squadre</h1>
	<div th:if="${teams==null || teams.isEmpty()}">Non ci sono squadre nel sistema</div>
	<ul>
		<li th:each="team : ${teams}" style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
			<img th:if="${team.logo != null and !team.logo.isEmpty()}" th:src="${team.logo}" alt="Logo"
				style="height: 35px; width: auto; object-fit: contain; margin-right: 15px;" />
			<a th:href="@{'/teams' + '/' + ${team.id}}" th:text="${team.name}">nome</a>
		</li>
	</ul>
	<div th:if="${isAdmin}">
		<a href="/admin/teams/new"><button type="button">Aggiungi squadra</button></a>
	</div>
</body>

</html>
