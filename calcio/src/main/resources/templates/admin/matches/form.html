<!DOCTYPE html>
<html>

<head>
    <title>Nuova Partita</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
    <header class="top-banner">
        <div class="banner-logo">
            <a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
        </div>
        <div class="banner-auth">
            <div th:if="${userDetails != null}">
                <span th:text="${loggedUsername}" class="username-display"></span>
                <form th:action="@{/logout}" method="POST" style="display:inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
            <div th:unless="${userDetails != null}">
                <a href="/login"><button type="button" class="btn-login">Login</button></a>
            </div>
        </div>
    </header>

    <h1>Aggiungi Partita</h1>
    <form th:action="@{/admin/matches}" method="POST" th:object="${match}">
        <input type="hidden" th:field="*{id}" />
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color:red">...</p>
        </div>
        <div>
            <label>Data:</label> <input type="date" th:field="${match.date}" required />
            <span th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
        </div>
        <div>
            <label>Ora:</label> <input type="time" th:field="${match.time}" required />
            <span th:if="${#fields.hasErrors('time')}" th:errors="*{time}"></span>
        </div>
        <div>
            <label>Torneo:</label>
            <select th:field="*{tournament}" required>
                <option value="">Seleziona Torneo</option>
                <option th:each="t : ${tournaments}" th:value="${t.id}" th:text="${t.name} + ' (' + ${t.year} + ')'">
                </option>
            </select>
        </div>
        <div>
            <label>Squadra Casa:</label>
            <select th:field="*{homeTeam}" required>
                <option value="">Seleziona Squadra Casa</option>
                <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div>
            <label>Squadra Ospite:</label>
            <select th:field="*{awayTeam}" required>
                <option value="">Seleziona Squadra Ospite</option>
                <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div>
            <label>Arbitro:</label>
            <select th:field="*{referee}">
                <option value="">Nessun Arbitro</option>
                <option th:each="r : ${referees}" th:value="${r.id}" th:text="${r.name} + ' ' + ${r.surname}"></option>
            </select>
        </div>
        <div>
            <label>Stato:</label>
            <select th:field="*{state}" required>
                <option value="SCHEDULED">IN PROGRAMMA</option>
                <option value="PLAYED">GIOCATA</option>
            </select>
        </div>
        <div>
            <label>Gol Casa:</label> <input type="number" th:field="${match.goalsHome}" />
        </div>
        <div>
            <label>Gol Ospite:</label> <input type="number" th:field="${match.goalsAway}" />
        </div>
        <div><button type="submit">Salva</button></div>
    </form>
    <br>
    <a th:href="@{/admin/index}">Torna alla dashboard Admin</a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const homeSelect = document.getElementById('homeTeam');
            const awaySelect = document.getElementById('awayTeam');

            function updateOptions() {
                const homeVal = homeSelect.value;
                const awayVal = awaySelect.value;

                Array.from(awaySelect.options).forEach(opt => {
                    if (opt.value !== "" && opt.value === homeVal) {
                        opt.style.display = 'none';
                        opt.disabled = true;
                    } else {
                        opt.style.display = '';
                        opt.disabled = false;
                    }
                });

                Array.from(homeSelect.options).forEach(opt => {
                    if (opt.value !== "" && opt.value === awayVal) {
                        opt.style.display = 'none';
                        opt.disabled = true;
                    } else {
                        opt.style.display = '';
                        opt.disabled = false;
                    }
                });
            }

            homeSelect.addEventListener('change', () => {
                updateOptions();
                if (awaySelect.value === homeSelect.value) awaySelect.value = "";
            });

            awaySelect.addEventListener('change', () => {
                updateOptions();
                if (homeSelect.value === awaySelect.value) homeSelect.value = "";
            });

            // Esegui all'avvio nel caso ci siano già valori selezionati (es. in modifica)
            updateOptions();

            // Logica per aggiornare automaticamente lo stato in base alla data e ora
            const dateInput = document.getElementById('date');
            const timeInput = document.getElementById('time');
            const stateSelect = document.getElementById('state');

            function updateMatchState() {
                if (!dateInput.value || !timeInput.value) return;
                
                const matchDateTime = new Date(`${dateInput.value}T${timeInput.value}`);
                const now = new Date();
                
                if (matchDateTime < now) {
                    stateSelect.value = "PLAYED";
                } else {
                    stateSelect.value = "SCHEDULED";
                }
            }

            if (dateInput && timeInput && stateSelect) {
                dateInput.addEventListener('change', updateMatchState);
                timeInput.addEventListener('change', updateMatchState);
                updateMatchState(); // Aggiorna all'avvio
            }
        });
    </script>
</body>

</html>
