<!DOCTYPE html>
<html>

<head>
    <title>Nuova Squadra</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    
    <h1 th:text="${team.id == null ? 'Aggiungi Squadra' : 'Modifica Squadra'}">Aggiungi Squadra</h1>
    <form th:action="@{/admin/teams}" method="POST" th:object="${team}" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{logo}" />
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color:red">...</p>
        </div>
        <div>
            <label>Nome:</label> <input type="text" th:field="${team.name}" required />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div>
            <label>Anno di Fondazione:</label> <input type="number" th:field="${team.yearFoundation}" />
            <span th:if="${#fields.hasErrors('yearFoundation')}" th:errors="*{yearFoundation}"></span>
        </div>
        <div>
            <label>Città:</label> <input type="text" th:field="${team.city}" />
            <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
        </div>
        <div>
            <label>Logo:</label> 
            <input type="file" name="logoFile" accept="image/*" />
        </div>
        <div><button type="submit">Salva</button></div>
    </form>
    <br>

</body>

</html>
