<!DOCTYPE html>
<html>

<head>
    <title>Dettagli Giocatore</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    
    <h1>Dettagli Giocatore</h1>
    <div th:if="${player}" class="content-card">

        <div style="text-align: center; margin-bottom: 40px;">
            <h2 th:text="${player.name} + ' ' + ${player.surname}" style="font-weight: bold; margin-bottom: 10px;">Nome Cognome</h2>
        </div>

        <div>
            <strong>Data di Nascita:</strong> <span th:text="${player.dateOfBirth}">01/01/2000</span>
        </div>
        <div>
            <strong>Ruolo:</strong> <span th:text="${player.role}">Attaccante</span>
        </div>
        <div>
            <strong>Altezza:</strong> <span th:text="${player.height} + ' cm'">180 cm</span>
        </div>

        <div>
            <strong>Squadra:</strong>
            <ul th:if="${player.team}">
                <li class="bg-banner-style">
                    <a th:href="@{'/teams/' + ${player.team.id}}" th:text="${player.team.name}">Nome Squadra</a>
                </li>
            </ul>
            <span th:unless="${player.team}">Svincolato</span>
        </div>

        <div th:if="${isAdmin}">
            <hr>
            <h3>Amministrazione</h3>
            <a th:href="@{'/admin/players/' + ${player.id} + '/edit'}"><button type="button">Modifica Giocatore</button></a>
            <form th:action="@{'/admin/players/' + ${player.id} + '/delete'}" method="POST" style="display:inline;">
                <button type="submit"
                    onclick="return confirm('Sei sicuro di voler eliminare questo giocatore?')">Elimina
                    Giocatore</button>
            </form>
        </div>

    </div>

    <div th:unless="${player}">Il giocatore richiesto non esiste.</div>
</body>

</html>
