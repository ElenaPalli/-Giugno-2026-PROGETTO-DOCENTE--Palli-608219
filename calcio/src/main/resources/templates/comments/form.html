<!DOCTYPE html>
<html>

<head>
    <title>Modifica Commento</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${userDetails.username}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    

    <h1>Modifica Commento</h1>

    <div th:if="${comment != null}">
        <form th:action="@{'/user/comments/' + ${comment.id} + '/edit'}" method="POST" th:object="${comment}">
            <input type="hidden" th:field="*{id}" />

            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color:red">...</p>
            </div>

            <div>
                <label>Testo del commento:</label>
                <textarea th:field="*{text}" required rows="5" cols="60"></textarea>
                <span th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span>
            </div>

            <div style="margin-top: 15px;">
                <button type="submit">Salva Modifiche</button>
                <a th:href="@{'/matches/' + ${comment.match.id}}" style="margin-left: 10px;">Annulla</a>
            </div>
        </form>
    </div>

    <div th:unless="${comment}">Il commento non esiste o non sei autorizzato a modificarlo.</div>
</body>

</html>
