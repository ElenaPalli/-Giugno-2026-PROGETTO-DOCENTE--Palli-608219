<!DOCTYPE html>
<html>

<head>
    <title>Arbitri</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    
    <h1>Arbitri</h1>
    <div th:if="${referees==null || referees.isEmpty()}">Non ci sono arbitri nel sistema</div>
    <ul>
        <li th:each="referee : ${referees}">
            <a th:href="@{'/referees' + '/' + ${referee.id}}" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div th:text="${referee.name} + ' ' + ${referee.surname}" style="font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Nome Cognome</div>
                <div style="font-size: 14px; font-weight: 600; color: #0056b3; width: 100%; text-align: right; box-sizing: border-box; padding-right: 24px; margin-top: auto;">Esplora &rarr;</div>
            </a>
        </li>
    </ul>
    <div th:if="${isAdmin}">
        <a href="/admin/referees/new"><button type="button">Aggiungi arbitro</button></a>
    </div>
</body>

</html>
