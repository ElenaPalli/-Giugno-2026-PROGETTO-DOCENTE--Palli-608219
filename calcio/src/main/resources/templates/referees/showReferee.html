<!DOCTYPE html>
<html>

<head>
    <title>Dettagli Arbitro</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${loggedUsername}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
	
	<div style="margin-bottom: 20px;">
		<a th:href="@{/referees/react}" class="btn-text" style="font-size: 16px; color: #0056b3 !important;">&larr; Torna all'elenco</a>
	</div>
    
    <h1>Dettagli Arbitro</h1>

    <div th:if="${referee}" class="content-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 th:text="${referee.name} + ' ' + ${referee.surname}" style="margin-bottom: 10px;">Nome Cognome</h2>
            <span style="color: var(--text-muted);">Codice Arbitrale: <strong th:text="${referee.refereeCode}" style="color: var(--text-main);">Codice</strong></span>
        </div>

        <div th:if="${isAdmin}">
            <hr>
            <h3>Amministrazione</h3>
            <a th:href="@{'/admin/referees/' + ${referee.id} + '/edit'}"><button type="button">Modifica Arbitro</button></a>
            <form th:action="@{'/admin/referees/' + ${referee.id} + '/delete'}" method="POST" style="display:inline;">
                <button type="submit" class="btn-danger" onclick="return confirm('Sei sicuro di voler eliminare questo arbitro?')">Elimina
                    Arbitro</button>
            </form>
        </div>
    </div>

    <div th:unless="${referee}">
        L'arbitro richiesto non esiste.
    </div>


</body>

</html>
