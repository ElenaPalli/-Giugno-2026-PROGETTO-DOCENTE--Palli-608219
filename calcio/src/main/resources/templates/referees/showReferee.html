<!DOCTYPE html>
<html>

<head>
    <title>Dettagli Arbitro</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header class="top-banner">
		<div class="banner-logo">
			<a href="/"><img src="/images/logo-siw.png" alt="Calcio Analytics" /></a>
		</div>
		<div class="banner-auth">
			<div th:if="${userDetails != null}">
				<span th:text="${userDetails.username}" class="username-display"></span>
				<form th:action="@{/logout}" method="POST" style="display:inline;">
					<button type="submit" class="btn-logout">Logout</button>
				</form>
			</div>
			<div th:unless="${userDetails != null}">
				<a href="/login"><button type="button" class="btn-login">Login</button></a>
			</div>
		</div>
	</header>
    
    <h1>Dettagli Arbitro</h1>

    <div th:if="${referee}" class="content-card">
        <p><strong>Nome:</strong> <span th:text="${referee.name}">Nome</span></p>
        <p><strong>Cognome:</strong> <span th:text="${referee.surname}">Cognome</span></p>
        <p><strong>Codice Arbitrale:</strong> <span th:text="${referee.refereeCode}">Codice</span></p>

        <div th:if="${isAdmin}">
            <hr>
            <h3>Amministrazione</h3>
            <a th:href="@{'/admin/referees/' + ${referee.id} + '/edit'}"><button type="button">Modifica Arbitro</button></a>
            <form th:action="@{'/admin/referees/' + ${referee.id} + '/delete'}" method="POST" style="display:inline;">
                <button type="submit" onclick="return confirm('Sei sicuro di voler eliminare questo arbitro?')">Elimina
                    Arbitro</button>
            </form>
        </div>
    </div>

    <div th:unless="${referee}">
        L'arbitro richiesto non esiste.
    </div>

    <div>
        <br>
        <a href="/referees/react">Torna all'elenco degli arbitri</a>
    </div>
</body>

</html>
